name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend - build e testes unitários
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar documentação Swagger (build)
        run: npm run swagger

      - name: Rodar testes unitários
        run: npm test

  docker-build:
    name: Docker - build das imagens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem do backend
        run: docker build -t simpletodo-backend ./backend

      - name: Build da imagem do frontend
        run: docker build -t simpletodo-frontend ./frontend
